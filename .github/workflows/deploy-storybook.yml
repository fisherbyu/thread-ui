name: Deploy thread-ui Docs

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'package.json'

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: fisherbyu/thread-ui

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Build Storybook
              run: make storybook-build

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.storybook
                  push: true
                  tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Install cloudflared
              run: |
                  curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                  sudo dpkg -i cloudflared.deb

            - name: Configure SSH
              env:
                  SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  cat >> ~/.ssh/config <<EOF
                  Host deploy
                    HostName ssh.fisherandrew.org
                    User ${{ secrets.SERVER_USER }}
                    IdentityFile ~/.ssh/id_deploy
                    ProxyCommand cloudflared access ssh --hostname %h
                    StrictHostKeyChecking accept-new
                  EOF

            - name: Deploy to server
              env:
                  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: ssh deploy 'cd /srv/a-fisher-data-center && make pull up S=thread-docs'
